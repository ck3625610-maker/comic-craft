<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export Success — ComicCraft</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="success">
  <div class="success-icon">✓</div>
  <p class="eyebrow">EXPORT SUCCESS</p>
  <h1>{{ title }}</h1>
  <p>Your ComicCraft comic has been prepared for PDF export.</p>
  <a class="primary" href="/export/{{ comic_id }}">Download PDF</a>
  <a class="ghost" href="/">Create another comic</a>
</main>
</body>
</html>
